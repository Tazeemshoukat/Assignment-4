<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login page</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      color: #1877f2;
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #1c1e21;
      margin-bottom: 30px;
    }

    .login-box {
      background: white;
      width: 350px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input[type="text"], input[type="password"] {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #dddfe2;
      border-radius: 6px;
      font-size: 16px;
    }

    .login-btn {
      width: 95%;
      padding: 12px;
      background-color: #1877f2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
    }

    .login-btn:hover {
      background-color: #166fe5;
    }

    .forgot {
      display: block;
      margin: 10px 0;
      color: #1877f2;
      text-decoration: none;
      font-size: 14px;
    }

    .create-btn {
      background-color: #42b72a;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .create-btn:hover {
      background-color: #36a420;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 14px;
      color: #606770;
    }

    .footer-text a {
      color: #1c1e21;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Facebook</h1>
  <p>Facebook helps you connect and share with the people in your life.</p>

  <div class="login-box">
    <input type="text" placeholder="Email address or phone number"><br>
    <input type="password" placeholder="Password"><br>
    <button class="login-btn">Log in</button><br>
    <a href="#" class="forgot">Forgotten password?</a>
    <hr>
    <button class="create-btn">Create new account</button>
  </div>

  <p class="footer-text">
    <a href="#">Create a Page</a> for a celebrity, brand or business.
  </p>

</body>
</html>
